<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Extensibility</title>
<style>/* system-design-skills dark theme, single look by design */
:root { color-scheme: dark; --bg: #020617; --panel: rgba(15,23,42,0.5); --line: #1e293b; --muted: #94a3b8; --dim: #475569;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
body { background: var(--bg); color: #fff; font-family: var(--mono);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 40px; }
.container { max-width: 1500px; margin: 0 auto; display: grid; gap: 26px; }
.header-row { display: flex; align-items: center; gap: 1rem; margin-bottom: .5rem; }
.pulse-dot { width: 12px; height: 12px; background: #22d3ee; border-radius: 50%; animation: pulse 2s infinite; flex: none; }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .5 } }
@media (prefers-reduced-motion: reduce) { .pulse-dot { animation: none } }
h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -.025em; margin: 0; }
h2 { font-size: 1.05rem; font-weight: 700; margin: 0 0 4px; }
.subtitle, .lead { color: var(--muted); font-size: .85rem; line-height: 1.55; margin: 0; max-width: 90ch; }
.subtitle { margin-left: 1.75rem; }
nav { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 14px 0 0 1.75rem; font-size: .8rem; }
nav a { color: #22d3ee; text-decoration: none; border-bottom: 1px solid rgba(34,211,238,.35); }
nav a:hover, nav a:focus-visible { color: #fff; border-color: #fff; outline: none; }
section { display: grid; gap: 12px; min-width: 0; }
.diagram-container { background: var(--panel); border-radius: 1rem; border: 1px solid var(--line); padding: 1rem; overflow-x: auto; }
svg { width: 100%; min-width: 1100px; display: block; height: auto; font-family: var(--mono); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
.card { background: var(--panel); border-radius: .75rem; border: 1px solid var(--line); padding: 1.1rem 1.25rem; min-width: 0; }
.card-header { display: flex; align-items: center; gap: .5rem; margin-bottom: .6rem; }
.card-dot { width: 8px; height: 8px; border-radius: 50%; }
.card-dot.cyan { background: #22d3ee } .card-dot.emerald { background: #34d399 } .card-dot.violet { background: #a78bfa }
.card-dot.amber { background: #fbbf24 } .card-dot.rose { background: #fb7185 }
.card h3 { font-size: .85rem; font-weight: 600; margin: 0; }
.card ul { list-style: none; color: var(--muted); font-size: .75rem; line-height: 1.5; margin: 0; padding: 0; display: grid; gap: .35rem; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: .75rem; background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: .78rem; line-height: 1.45; }
th, td { text-align: left; vertical-align: top; padding: 8px 14px; border-bottom: 1px solid var(--line); }
th { color: var(--dim); font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; }
td { color: var(--muted); } td:first-child { color: #fff; white-space: nowrap; }
.footer { text-align: center; color: var(--dim); font-size: .72rem; margin: 0; }
</style>
</head>
<body>
<div class="container"><div class="header"><div class="header-row"><div class="pulse-dot"></div><h1>Agent Extensibility</h1></div><p class="subtitle">Task: "easily extendable for new capabilities (generating graphs, sending reports via mail, searching the web for trends, etc)". Solid = built or designed, dashed = extension point.</p></div>
