es</text><text x="235.0" y="209.0" fill="#94a3b8" font-size="9.5" text-anchor="middle">approved analyst answers</text><text x="235.0" y="224.0" fill="#94a3b8" font-size="9.5" text-anchor="middle">golden/*.yaml, added by analysts</text><rect x="40" y="270" width="390" height="70" rx="6" fill="#0f172a"/><rect x="40" y="270" width="390" height="70" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/><text x="235.0" y="294.0" fill="white" font-size="11" font-weight="600" text-anchor="middle">User notes</text><text x="235.0" y="309.0" fill="#94a3b8" font-size="9.5" text-anchor="middle">how each user likes answers</text><text x="235.0" y="324.0" fill="#94a3b8" font-size="9.5" text-anchor="middle">prefs.json, written by the agent</text><rect x="970" y="65" width="390" height="60" rx="6" fill="#0f172a"/><rect x="970" y="65" width="390" height="60" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/><text x="1165.0" y="84.0" fill="white" font-size="11" font-weight="600" text-anchor="middle">Rules + guardrail prompt</text><text x="1165.0" y="99.0" fill="#94a3b8" font-size="9.5" text-anchor="middle">scope, refusals, checks</text><text x="1165.0" y="114.0" fill="#94a3b8" font-size="9.5" text-anchor="middle">prompts.yaml</text><rect x="970" y="141" width="390" height="60" rx="6" fill="#0f172a"/><rect x="970" y="141" width="390" height="60" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/><text x="1165.0" y="160.0" fill="white" font-size="11" font-weight="600" text-anchor="middle">Skills</text><text x="1165.0" y="175.0" fill="#94a3b8" font-size="9.5" text-anchor="middle">SQL, reports, preferences, charts</text><text x="1165.0" y="190.0" fill="#94a3b8" font-size="9.5" text-anchor="middle">skills/*.yaml + *.py</text><rect x="970" y="217" width="390" height="60" rx="6" fill="#0f172a"/><rect x="970" y="217" width="390" height="60" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/><text x="1165.0" y="236.0" 