question: What is our monthly revenue trend?
sql: |
  SELECT FORMAT_DATE('%Y-%m', DATE(oi.created_at)) AS month,
         ROUND(SUM(oi.sale_price), 2) AS revenue,
         COUNT(DISTINCT oi.order_id) AS orders
  FROM `bigquery-public-data.thelook_ecommerce.order_items` oi
  WHERE oi.status NOT IN ('Cancelled', 'Returned')
  GROUP BY month ORDER BY month
report: |
  Revenue counts only items that were not cancelled or returned (net revenue).
  Analysts compare the last full month with the same month last year to remove seasonality,
  and flag months where order count and revenue move in different directions (basket size change).
